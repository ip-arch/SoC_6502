# Memory configuration for the Apple-I with 8K RAM 
# Contributed by Naohiko Shimizu
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0100; # 256 bytes stack
}
MEMORY {
    ZP: start =  $0000, size = $0100, type = rw, define = yes;
    RAM: start = $0200, size = $1E00, define = yes;
    MAIN: start = $F000, size = $1000, file = %O;
}
SEGMENTS {
    ZEROPAGE:  load = ZP, type = zp, define = yes;
    DATA:     load = MAIN, type = rw, define = yes, run = RAM;
    BSS:      load = RAM, type = bss, define = yes;
    HEAP:     load = RAM, type = bss, optional = yes; # must sit just below stack
    STARTUP:  load = MAIN, type = ro;
    ONCE:     load = MAIN, type = ro, optional = yes;
    INIT:     load = MAIN, type = ro, optional = yes;
    CODE:     load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro;
    VECTORS:   load = MAIN, type = ro, start = $FFFA;
}
FEATURES {
    CONDES: segment = INIT,
	    type = constructor,
	    label = __CONSTRUCTOR_TABLE__,
	    count = __CONSTRUCTOR_COUNT__;
    CONDES: segment = RODATA,
	    type = destructor,
	    label = __DESTRUCTOR_TABLE__,
	    count = __DESTRUCTOR_COUNT__;
    CONDES: segment = RODATA,
	    type = interruptor,
	    label = __INTERRUPTOR_TABLE__,
	    count = __INTERRUPTOR_COUNT__;
}
